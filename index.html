  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <script>
    // Asegúrate de que tu función stopTracking esté AQUÍ DENTRO
    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      releaseWakeLock();
      isTracking = false;

      const routeId = document.getElementById('driverRouteSelect').value;
      
      if (totalDistanceKm === 0) {
        totalDistanceKm = calculateRouteDistance(routeId);
      }

      document.getElementById('driverStatus').innerText = `Recorrido N°${routeId} finalizado en Liceo Tiuquilemu.`;
      document.getElementById('kmCounter').innerText = `Distancia total final: ${totalDistanceKm.toFixed(2)} km`;

      const btn = document.getElementById('toggleRouteBtn');
      btn.innerText = 'Iniciar Recorrido';
      btn.className = 'btn-start';

      showDriverSummaryMap(routeId);
    }
  </script>
</body>
</html>
Guarda los cambios, recarga la página en el navegador (presionando Ctrl + F5 o borrando caché) y el texto desaparecerá de la vista principal, pasando a funcionar correctamente.
