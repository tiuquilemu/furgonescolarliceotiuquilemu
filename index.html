<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoreo Furgón Escolar</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; background-color: #f4f4f9; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 480px; margin: 0 auto 16px; }
    h2 { margin-top: 0; color: #1a73e8; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-start { background-color: #34a853; color: white; }
    .btn-stop { background-color: #ea4335; color: white; }
    .btn-switch { background-color: #f1f3f4; color: #333; border: 1px solid #ccc; margin-bottom: 16px; }
    .status-box { padding: 12px; border-radius: 8px; background-color: #e8f0fe; color: #1967d2; font-weight: 500; margin-top: 12px; }
    .banner { background-color: #fef7e0; color: #b06000; padding: 10px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Switch de Rol -->
  <div style="max-width: 480px; margin: 0 auto;">
    <button class="btn-switch" onclick="toggleRole()">Cambiar Vista (Conductor / Apoderado)</button>
  </div>

  <!-- Vista Conductor -->
  <div id="driverView" class="card">
    <h2>Vista Conductor</h2>
    <div class="banner">💡 Mantén la pantalla activa durante el recorrido para evitar que el GPS se detenga.</div>
    <p>Estado del permiso GPS: <strong id="gpsPermission">Sin solicitar</strong></p>
    <div id="driverStatus" class="status-box">Recorrido detenido</div>
    <button id="toggleRouteBtn" class="btn-start" onclick="toggleRoute()">Iniciar Recorrido</button>
  </div>

  <!-- Vista Apoderado -->
  <div id="parentView" class="card hidden">
    <h2>Vista Apoderado</h2>
    <p>Estado del furgón escolar:</p>
    <div id="parentStatus" class="status-box">Esperando datos del vehículo...</div>
    <p style="font-size: 14px; color: #666; margin-top: 16px;">
      Últimas coordenadas: <br>
      <span id="coords">Lat: --, Lon: --</span>
    </p>
  </div>

  <script>
    let isTracking = false;
    let watchId = null;
    let currentRole = 'driver';

    function toggleRole() {
      currentRole = currentRole === 'driver' ? 'parent' : 'driver';
      document.getElementById('driverView').classList.toggle('hidden', currentRole !== 'driver');
      document.getElementById('parentView').classList.toggle('hidden', currentRole !== 'parent');
    }

    function toggleRoute() {
      if (!isTracking) {
        startTracking();
      } else {
        stopTracking();
      }
    }

    function startTracking() {
      if (!('geolocation' in navigator)) {
        alert('Tu navegador no soporta geolocalización.');
        return;
      }

      document.getElementById('gpsPermission').innerText = 'Solicitando...';

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          document.getElementById('gpsPermission').innerText = 'Concedido';
          document.getElementById('driverStatus').innerText = `En ruta: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
          document.getElementById('parentStatus').innerText = `Furgón en movimiento`;
          document.getElementById('coords').innerText = `Lat: ${latitude}, Lon: ${longitude}`;
        },
        (error) => {
          document.getElementById('gpsPermission').innerText = 'Denegado / Error';
          alert('Error al acceder al GPS: ' + error.message);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );

      isTracking = true;
      const btn = document.getElementById('toggleRouteBtn');
      btn.innerText = 'Finalizar Recorrido';
      btn.className = 'btn-stop';
    }

    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      isTracking = false;
      document.getElementById('driverStatus').innerText = 'Recorrido detenido';
      document.getElementById('parentStatus').innerText = 'El furgón no está en ruta';
      const btn = document.getElementById('toggleRouteBtn');
      btn.innerText = 'Iniciar Recorrido';
      btn.className = 'btn-start';
    }
  </script>
</body>
</html>
